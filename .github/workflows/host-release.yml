name: Host release
on:
  push:
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'server/**'
      - 'test/**'
      - 'third_party/**'
      - 'pubspec.*'
      - 'requirements.txt'
      - 'tool/*host*'
      - 'tool/tests/**'
      - '.github/workflows/host-release.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: host-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Set HOST_RELEASE_BRANCH to opt a non-default branch into production.
    if: github.ref_name == (vars.HOST_RELEASE_BRANCH || github.event.repository.default_branch)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Build and test host bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Location
          if (!(Test-Path pubspec.yaml)) { throw 'Not project root' }
          function Checked([scriptblock]$Command) {
            & $Command
            if ($LASTEXITCODE -ne 0) { throw "Command failed: $Command" }
          }
          Checked { python -m pip install -r requirements.txt httpx }
          Checked { python -m unittest discover -s server/tests }
          Checked { python -m unittest discover -s tool/tests }
          Checked { flutter pub get }
          Checked { dart run build_runner build --delete-conflicting-outputs }
          Checked { flutter test }
          $version = ((Get-Content pubspec.yaml | Select-String '^version:').Line -replace '^version:\s*', '').Trim()
          Checked { flutter build web --release --pwa-strategy=none "--dart-define=PDF_VIEWER_APP_VERSION=$version" }
          Checked { python -m pip download --only-binary=:all: -r requirements.txt -d wheelhouse }
          Checked { python tool/package_host_release.py --revision $env:GITHUB_SHA }
      - uses: actions/upload-artifact@v4
        with:
          name: host-release
          path: dist/host.zip*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: host-release
          path: dist
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TAG: host-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          gh release create "$TAG" --target "$REVISION" --draft --title "$TAG" --notes "Server and Web only. Data compatibility epoch: 1."
          gh release upload "$TAG" dist/host.zip dist/host.zip.sha256
          gh release edit "$TAG" --draft=false --latest=false
