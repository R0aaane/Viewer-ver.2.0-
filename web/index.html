<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="theme-color" content="#f2b7c8">
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pdf_viewer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>pdf_viewer</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #080506;
      color: #f6f7fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #boot-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(242, 183, 200, 0.22), transparent 36%),
        linear-gradient(180deg, #171016 0%, #080506 100%);
    }

    #boot-card {
      width: min(92vw, 32rem);
      padding: 1.25rem 1.1rem;
      border-radius: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(18, 12, 15, 0.92);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.34);
    }

    #boot-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
    }

    #boot-text {
      margin: 0.85rem 0 0;
      color: rgba(255, 255, 255, 0.80);
      line-height: 1.6;
      font-size: 0.95rem;
    }

    #boot-help {
      display: none;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.10);
      color: rgba(255, 255, 255, 0.86);
      line-height: 1.7;
      font-size: 0.92rem;
    }

    #boot-help strong {
      color: #ffffff;
    }

    .boot-spinner {
      width: 2rem;
      height: 2rem;
      margin-bottom: 0.9rem;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.14);
      border-top-color: #f2b7c8;
      animation: boot-spin 0.9s linear infinite;
    }

    .boot-hidden {
      display: none !important;
    }

    @keyframes boot-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div id="boot-overlay">
    <div id="boot-card">
      <div class="boot-spinner" aria-hidden="true"></div>
      <p id="boot-title">Loading web app...</p>
      <p id="boot-text">Flutter Web を起動しています。初回は少し時間がかかることがあります。</p>
      <div id="boot-help">
        <strong>Safari で長く止まる場合:</strong><br>
        `flutter run -d web-server` の debug 配信は Safari で不安定なことがあります。<br>
        iPhone / Safari での確認は release ビルドを静的配信した方が安定します。
      </div>
    </div>
  </div>
  <script>
    (function () {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (registration) {
            registration.unregister();
          });
        }).catch(function () {});
      }

      var overlay = document.getElementById('boot-overlay');
      var help = document.getElementById('boot-help');
      var helpTimer = window.setTimeout(function () {
        if (help) {
          help.style.display = 'block';
        }
      }, 12000);

      function hideOverlay() {
        if (helpTimer) {
          window.clearTimeout(helpTimer);
          helpTimer = 0;
        }
        if (overlay) {
          overlay.classList.add('boot-hidden');
        }
      }

      function flutterViewReady() {
        return !!document.querySelector('flutter-view, flt-glass-pane, flt-scene-host');
      }

      window.__hideFlutterBootOverlay = hideOverlay;
      window.addEventListener('flutter-first-frame', hideOverlay);

      var observer = new MutationObserver(function () {
        if (flutterViewReady()) {
          hideOverlay();
          observer.disconnect();
        }
      });

      observer.observe(document.documentElement, {
        childList: true,
        subtree: true,
      });

      var pollCount = 0;
      var poll = window.setInterval(function () {
        pollCount += 1;
        if (flutterViewReady()) {
          window.clearInterval(poll);
          hideOverlay();
        } else if (pollCount > 120) {
          window.clearInterval(poll);
        }
      }, 500);
    })();

    window.pdfRenderOptions = {
      cMapUrl: 'https://unpkg.com/pdfjs-dist@3.11.174/cmaps/',
      cMapPacked: true,
    };

    window.pdfjsLib = window.pdfjsLib || {
      GlobalWorkerOptions: {},
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
